            "@type": "SoftwareApplication",

              "Full-stack development in the browser via WebContainers",

                "price": "0",

                "description": "Hosted at koadr.dev with limited cloud-synced projects, storage, history and deployments."

                "@type": "Offer",
                "name": "Pro",
                "price": "9.90",

            "sameAs": ["https://github.com/iliasgnrs/koadr"]

    <script>
      try {
        var t = localStorage.getItem('koadr-theme')
        var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
